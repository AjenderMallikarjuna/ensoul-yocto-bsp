#@TYPE: Machine
#@NAME: Youyeetoo YY3588 (RK3588)
#@DESCRIPTION: Youyeetoo YY3588 with Rockchip RK3588 (4x Cortex-A76 + 4x Cortex-A55)

require conf/machine/include/rk3588.inc

KERNEL_DEVICETREE = "rockchip/rk3588-youyeetoo-yy3588.dtb"

UBOOT_MACHINE = "youyeetoo-yy3588-rk3588_defconfig"

# RTL8852BE WiFi 6 + BT 5.2 combo (rtw89 driver)
# Firmware package added via anime-ai-image once exact split-package name is confirmed
MACHINE_FEATURES:append = " wifi bluetooth"

SERIAL_CONSOLES = "1500000;ttyS2"
