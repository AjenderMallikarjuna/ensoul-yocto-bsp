#@TYPE: Machine
#@NAME: Orange Pi 5 (RK3588S)
#@DESCRIPTION: Orange Pi 5 with Rockchip RK3588S (4x Cortex-A76 + 4x Cortex-A55)

require conf/machine/include/rk3588.inc

KERNEL_DEVICETREE = "rockchip/rk3588s-orangepi-5.dtb"

UBOOT_MACHINE = "orangepi-5-rk3588s_defconfig"

# Orange Pi 5 uses AP6275P (WiFi 6) + BT combo
RK_WIFIBT_RRECOMMENDS = " \
    rkwifibt-firmware-ap6275p-wifi \
    rkwifibt-firmware-ap6275-bt \
    brcm-tools \
"

SERIAL_CONSOLES = "1500000;ttyS2"

# eMMC + SD card boot
MACHINE_FEATURES:append = " wifi bluetooth"
